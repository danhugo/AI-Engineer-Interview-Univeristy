[project]
name = "transformer-from-scratch"
version = "0.1.0"
description = "Transformer implemented from scratch, for interview study."
requires-python = ">=3.11"
dependencies = [
    "tokenizers>=0.23.1",
    "torch",
    "transformers>=5.16.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "sacrebleu>=2.6.0",
]

# Discover transformer tests from the repo root.
[tool.pytest.ini_options]
pythonpath = ["AI/projects/transformer-from-scratch"]
testpaths = ["AI/projects/transformer-from-scratch"]
